<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratos - Gestão</title>
    <link rel="stylesheet" href="Style/prato.css">
</head>
<body>
    <nav>
        <h2>Menu Gestão</h2>
        <a href="index.html">Página Inicial</a>
        <a href="prato.html">Cadastro de Pratos</a>
        <a href="categoria.html">Categorias</a>
        <a href="chef.html">Cadastro de Chefs</a>
        <a href="fornecedor.html">Fornecedores</a>
    </nav>

    <main>
        <section class="Página">
            <h1>Cadastrar Novo Prato🍽️</h1>
            <form onsubmit="event.preventDefault(); alert('Prato salvo com sucesso!');">
                <div class="form-group">
                    <label for="nome-prato">Nome do Prato</label>
                    <input type="text" id="nome-prato" required placeholder="Ex: Filé à Parmegiana">
                </div>
                <div class="form-group">
                    <label for="ingredientes">Ingredientes</label>
                    <textarea id="ingredientes" rows="4" required placeholder="Ex: Carne, queijo, molho de tomate..."></textarea>
                </div>
                <button type="submit">Salvar Prato</button>
            </form>
        </section>
    </main>
</body>
</html>
