<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pratos - Gestão</title>
    <link rel="stylesheet" href="prato.css">    
</head>
<body>
    <nav>
        <h2>Menu Gestão</h2>
        <a href="index.html">Página Inicial</a>
        <a href="pratos.html" class="active">Cadastro de Pratos</a>
        <a href="categorias.html">Categorias</a>
        <a href="chefs.html">Cadastro de Chefs</a>
        <a href="fornecedores.html">Fornecedores</a>
    </nav>

    <main>
        <section class="Página">
            <h1>Cadastrar Novo Prato</h1>
            <form onsubmit="event.preventDefault(); alert('Prato salvo com sucesso!');">
                <div class="form-group">
                    <label for="nome-prato">Nome do Prato</label>
                    <input type="text" id="nome-prato" required placeholder="Ex: Filé à Parmegiana">
                </div>
                <div class="form-group">
                    <label for="ingredientes">Ingredientes</label>
                    <textarea id="ingredientes" rows="4" required placeholder="Ex: Carne, queijo, molho de tomate..."></textarea>
                </div>
                <div class="form-group">
                    <label for="peso">Peso (em gramas)</label>
                    <input type="number" id="peso" required placeholder="Ex: 450">
                </div>
                <button type="submit">Salvar Prato</button>
            </form>
        </section>
    </main>
</body>
</html>
